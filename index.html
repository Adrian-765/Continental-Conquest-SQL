<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Gran Guerra — 1914–1918</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>

    /* ══════════════════════════════════════════════════════
       PANTALLA DE CARGA
    ══════════════════════════════════════════════════════ */
    #intro-screen {
      position: fixed; inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: #050402;
    }

    /* La imagen se inserta como <img> real, no background-image,
       para garantizar que el navegador la cargue siempre */
    #intro-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      /* Empieza visible — brightness alto desde el inicio */
      animation: kbZoom 7s ease-out forwards;
      display: block;
    }
    @keyframes kbZoom {
      0%   { transform: scale(1.06); filter: brightness(0.80) sepia(0.25) contrast(1.05); }
      40%  { filter: brightness(0.70) sepia(0.28) contrast(1.06); }
      100% { transform: scale(1.00); filter: brightness(0.52) sepia(0.22) contrast(1.04); }
    }

    #intro-velo {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(4,3,1,0.55) 0%,
        rgba(4,3,1,0.00) 22%,
        rgba(4,3,1,0.00) 58%,
        rgba(4,3,1,0.82) 100%
      );
      pointer-events: none;
    }

    #intro-contenido {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      text-align: center;
      padding: 2rem;
    }

    .i-elem { opacity: 0; }

    .i-eyebrow {
      font-family: var(--font-typewriter);
      font-size: 0.72rem;
      letter-spacing: 0.46em;
      color: rgba(200,165,58,0.80);
      text-transform: uppercase;
      transform: translateY(10px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      text-shadow: 0 1px 8px rgba(0,0,0,0.9);
    }
    .i-eyebrow.on { opacity: 1; transform: translateY(0); }

    .i-titulo {
      font-family: var(--font-display);
      font-size: clamp(4rem, 11vw, 7.5rem);
      color: var(--gold-medal);
      line-height: 0.95;
      letter-spacing: 0.02em;
      text-shadow: 0 0 80px rgba(200,165,58,0.40), 0 3px 12px rgba(0,0,0,0.95);
      transform: scale(0.94);
      transition: opacity 1.5s ease, transform 1.5s ease;
    }
    .i-titulo.on { opacity: 1; transform: scale(1); }

    .i-rule {
      width: 120px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(200,165,58,0.65), transparent);
      transition: opacity 0.8s ease;
    }
    .i-rule.on { opacity: 1; }

    .i-anio {
      font-family: var(--font-typewriter);
      font-size: 0.94rem;
      letter-spacing: 0.60em;
      color: rgba(200,165,58,0.55);
      text-shadow: 0 1px 8px rgba(0,0,0,0.9);
      transition: opacity 0.9s ease;
    }
    .i-anio.on { opacity: 1; }

    .i-sub {
      font-family: var(--font-typewriter);
      font-size: 0.68rem;
      letter-spacing: 0.24em;
      color: rgba(232,215,180,0.62);
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0,0,0,0.9);
      transition: opacity 0.9s ease;
    }
    .i-sub.on { opacity: 1; }

    #intro-barra-area {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #intro-barra-area.on { opacity: 1; }

    .i-barra-label {
      font-family: var(--font-typewriter);
      font-size: 0.55rem;
      letter-spacing: 0.36em;
      color: rgba(200,165,58,0.45);
      text-transform: uppercase;
    }
    .i-barra-pista {
      width: 280px; height: 2px;
      background: rgba(200,165,58,0.14);
    }
    .i-barra-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(to right, rgba(200,165,58,0.30), rgba(200,165,58,0.90));
      transition: width 3.5s cubic-bezier(0.15, 0, 0.35, 1);
      box-shadow: 0 0 8px rgba(200,165,58,0.35);
    }

    /* ══════════════════════════════════════════════════════
       MENÚ PRINCIPAL — fondoIndex.png de fondo
    ══════════════════════════════════════════════════════ */
    #menu-principal {
      min-height: 100vh;
      position: relative;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
      opacity: 0;
      transition: opacity 1.2s ease;
      overflow: hidden;
    }
    #menu-principal.visible { opacity: 1; }

    #menu-fondo {
      position: absolute; inset: 0;
      background-image: url('img/fondoIndex.png');
      background-size: cover;
      background-position: center center;
      filter: brightness(0.38) sepia(0.35) contrast(1.1);
      animation: menuZoom 35s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes menuZoom {
      from { transform: scale(1.00); }
      to   { transform: scale(1.07); }
    }

    #menu-velo {
      position: absolute; inset: 0;
      background: radial-gradient(
        ellipse at 50% 45%,
        rgba(4,3,1,0.08) 0%,
        rgba(4,3,1,0.55) 55%,
        rgba(4,3,1,0.88) 100%
      );
      z-index: 1;
    }

    /* Contenido del menú por encima del fondo */
    #menu-principal > *:not(#menu-fondo):not(#menu-velo) {
      position: relative;
      z-index: 2;
    }

    .titulo-menu {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      color: var(--gold-medal);
      text-align: center;
      letter-spacing: 0.04em;
      line-height: 1;
      margin-bottom: 0.4rem;
      text-shadow: 0 2px 14px rgba(0,0,0,0.8);
    }
    .subtitulo-menu {
      font-family: var(--font-typewriter);
      font-size: 0.73rem;
      letter-spacing: 0.28em;
      color: var(--sepia-light);
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 0.35rem;
    }
    .anio-menu {
      font-family: var(--font-display);
      font-size: 0.93rem;
      color: var(--sepia-mid);
      text-align: center;
      font-style: italic;
      margin-bottom: 2.3rem;
    }

    .menu-botones {
      display: flex; flex-direction: column;
      gap: 0.82rem; align-items: center;
      width: 100%; max-width: 330px;
    }
    .menu-botones .btn {
      width: 100%;
      justify-content: center;
      font-size: 0.87rem;
      padding: 0.9rem 2rem;
    }

    .menu-sep {
      display: flex; align-items: center; gap: 0.9rem;
      width: 100%; color: var(--sepia-mid);
      font-size: 0.68rem; font-family: var(--font-typewriter);
      letter-spacing: 0.1em; margin: 0.15rem 0;
    }
    .menu-sep::before, .menu-sep::after {
      content: ''; flex: 1;
      border-top: 1px solid rgba(139,109,56,0.20);
    }

    .particula {
      position: fixed;
      border-radius: 50%;
      background: rgba(200,165,58,0.28);
      animation: flotar linear infinite;
      pointer-events: none;
      z-index: 3;
    }
    @keyframes flotar {
      from { transform: translateY(105vh); opacity: 0; }
      8%   { opacity: 1; }
      92%  { opacity: 1; }
      to   { transform: translateY(-80px); opacity: 0; }
    }

  </style>
</head>
<body class="page-bg">

  <!-- ══ PANTALLA DE CARGA ════════════════════════════════ -->
  <div id="intro-screen">
    <!-- <img> real en lugar de background-image para garantizar visibilidad -->
    <img id="intro-img" src="img/pantallaCarga.png" alt="">
    <div id="intro-velo"></div>
    <div id="intro-contenido">
      <div class="i-elem i-eyebrow" id="ie-ojo">Proyecto Educativo · Historia</div>
      <div class="i-elem i-titulo"  id="ie-tit">Continental<br>Conquest SQL</div>
      <div class="i-elem i-rule"    id="ie-rla"></div>
      <div class="i-elem i-anio"    id="ie-ani">1914 — 1918</div>
      <div class="i-elem i-sub"     id="ie-sub">La Gran Guerra</div>
    </div>
    <div id="intro-barra-area">
      <div class="i-barra-label">Cargando misión…</div>
      <div class="i-barra-pista"><div class="i-barra-fill" id="ie-bfill"></div></div>
    </div>
  </div>

  <!-- ══ MENÚ PRINCIPAL ─────────────────────────────── -->
  <!-- SIN libreta: las notas solo aparecen en los niveles -->
  <main id="menu-principal">
    <div id="menu-fondo"></div>
    <div id="menu-velo"></div>

    <h1 class="titulo-menu fade-in-delay-1" style="margin-top:-2rem;">Continental Conquest SQL</h1>
    <p class="subtitulo-menu fade-in-delay-2">La Gran Guerra</p>
    <p class="anio-menu fade-in-delay-2">MCMXIV — MCMXVIII</p>
    <div class="ornamento fade-in-delay-2">✦ ✦ ✦</div>
    <div class="menu-botones fade-in-delay-3">
      <button id="btn-nueva-partida" class="btn btn-primary">⚔ Nueva Partida</button>
      <div class="menu-sep">o bien</div>
      <button id="btn-cargar-partida" class="btn btn-secondary">📂 Cargar Partida</button>
    </div>
  </main>
  <!-- Footer eliminado -->

  <script src="js/main.js"></script>
  <script>
    (function () {
      function show(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('on');
      }

      /* Secuencia de aparición de textos */
      setTimeout(function(){ show('ie-ojo'); },  350);
      setTimeout(function(){ show('ie-tit'); },  800);
      setTimeout(function(){ show('ie-rla'); }, 1550);
      setTimeout(function(){ show('ie-ani'); }, 1850);
      setTimeout(function(){ show('ie-sub'); }, 2150);

      /* Barra de carga — doble rAF para disparar la transición CSS */
      setTimeout(function(){
        show('intro-barra-area');
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            var f = document.getElementById('ie-bfill');
            if (f) f.style.width = '100%';
          });
        });
      }, 2450);

      /* Fade out pantalla de carga → mostrar menú */
      setTimeout(function(){
        var scr  = document.getElementById('intro-screen');
        var menu = document.getElementById('menu-principal');
        if (scr) {
          scr.style.transition = 'opacity 1.2s ease';
          scr.style.opacity    = '0';
        }
        setTimeout(function(){
          if (scr)  scr.remove();
          if (menu) menu.classList.add('visible');
          crearParticulas();
        }, 1200);
      }, 6000);
    })();

    function crearParticulas() {
      for (var i = 0; i < 14; i++) {
        (function(n) {
          setTimeout(function() {
            var p  = document.createElement('div');
            p.className = 'particula';
            p.style.left = (Math.random() * 100) + 'vw';
            p.style.animationDuration = (12 + Math.random() * 13) + 's';
            p.style.animationDelay    = (Math.random() * 6)  + 's';
            var sz = 1 + Math.random() * 2.2;
            p.style.width = p.style.height = sz + 'px';
            document.body.appendChild(p);
          }, n * 280);
        })(i);
      }
    }
  </script>
</body>
</html>
